<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in – VERO Atlas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container nav-bar">
            <div class="logo">VERO Atlas</div>
            <nav>
                <a href="index.html">Hem</a>
                <a href="shipping.html">Shipping-modul</a>
                <a href="login.html" class="active">Logga in</a>
            </nav>
        </div>
    </header>

    <main class="auth">
        <div class="container">
            <h2>Logga in på ditt konto</h2>
            <form class="auth-form" onsubmit="return false;">
                <label for="email">E-post</label>
                <input type="email" id="email" name="email" placeholder="din@e-post.se" required>

                <label for="password">Lösenord</label>
                <input type="password" id="password" name="password" placeholder="Lösenord" required>

                <button class="btn" type="submit">Logga in</button>
                <p class="small">Har du inget konto? <a href="#">Registrera dig</a></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 VERO Capital – Alla rättigheter förbehållna.</p>
        </div>
    </footer>
</body>
</html>
