<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>VERO Atlas Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2a4d9b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1d3670;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Logga in till VERO Atlas</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Användarnamn" required>
      <input type="password" id="password" placeholder="Lösenord" required>
      <button type="submit">Logga in</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      // Enkel test-inloggning (byt till riktig validering senare)
      if (user === "admin" && pass === "vero123") {
        localStorage.setItem('atlasLoggedIn', 'true');
        window.location.href = 'shipping.html';
      } else {
        alert("Fel användarnamn eller lösenord");
      }
    });

    <script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {

      localStorage.setItem('atlasLoggedIn', 'true');    // markera att vi är inloggade
      window.location.href = 'shipping.html';          // vidare till shipping
    } else {
      alert('Fel användarnamn eller lösenord');

</script>
  </script>
</body>
</html>
