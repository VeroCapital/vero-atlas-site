<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERO Atlas – Login</title><link rel="stylesheet" href="styles.css"></head><body>
  <header><div class="container nav-bar"><div class="logo">VERO Atlas</div><nav><a href="index.html">Hem</a><a href="shipping.html">Shipping-modul</a><a href="categories.html">Categories</a><a class="active" href="login.html">Logga in</a></nav></div></header>
  <main class="auth"><form id="loginForm" class="auth-form"><h3 style="margin-top:0">Logga in till VERO Atlas</h3><label for="username">Användarnamn</label><input id="username" autocomplete="username" required><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit" style="margin-top:10px">Logga in</button><p id="error" class="small" style="color:#ffb3b3;min-height:1.25rem"></p><p class="small muted">Klientsideskydd för icke-känsligt innehåll.</p></form></main>
  <script>const USER='vero',PASS='atlas123';document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;const err=document.getElementById('error');if(u===USER&&p===PASS){localStorage.setItem('atlasLoggedIn','true');localStorage.setItem('atlasUser',u);location.href='shipping.html';}else{err.textContent='Fel användarnamn eller lösenord';}});</script>
  </body></html>
